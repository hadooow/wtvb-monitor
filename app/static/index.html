<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>工业无线温振监测系统</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">INDUSTRIAL CONDITION MONITORING</p>
      <h1>工业无线温振监测系统</h1>
    </div>
    <div class="top-actions">
      <div id="gatewayBadge" class="gateway-badge">网关连接中</div>
      <button type="button" class="secondary" id="settingsButton">采集设置</button>
      <button type="button" class="secondary" id="downloadLogsButton">下载诊断日志</button>
      <button type="button" class="primary" id="addButton">添加设备</button>
    </div>
  </header>

  <main>
    <p id="gatewayWarning" class="gateway-warning" role="status" hidden></p>
    <section class="status-overview" aria-label="设备采集状态">
      <div class="overview-heading"><p class="eyebrow">COLLECTION STATUS</p><h2>设备采集状态</h2></div>
      <div class="status-stat accent"><strong id="connectedCount">0</strong><span id="connectionLimit">/ 5 路连接</span></div>
      <div class="status-stat"><strong id="deviceCount">0</strong><span>已登记</span></div>
      <div class="status-stat"><strong id="collectingCount">0</strong><span>正在采集</span></div>
      <div class="status-stat"><strong id="queuedCount">0</strong><span>排队等待</span></div>
      <div class="status-stat"><strong id="errorCount">0</strong><span>异常 / 重试</span></div>
    </section>

    <section class="devices-section">
      <div class="section-title">
        <div><p class="eyebrow">SENSOR FLEET</p><h2>设备总览</h2></div>
        <div class="legend"><span><i class="dot live"></i>采集中</span><span><i class="dot queued"></i>排队中</span><span><i class="dot error"></i>异常</span></div>
      </div>
      <div id="deviceGrid" class="device-grid"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <form id="settingsForm">
      <div class="dialog-title"><h2>采集设置</h2><button type="button" data-close="settingsDialog" class="icon-button" aria-label="关闭">×</button></div>
      <label>网关模式<select name="gateway_driver"><option value="simulator">模拟网关（测试用）</option><option value="serial">真实 EW-DTU02 网关</option></select></label>
      <label>真实网关串口<input name="serial_port" placeholder="COM3"></label>
      <label>串口波特率<input name="baudrate" type="number" min="1200" max="921600" required></label>
      <label>连接超时（秒，手册建议 40）<input name="connect_timeout_seconds" type="number" min="5" max="60" required></label>
      <label>目标同时连接数量<input name="max_connections" type="number" min="1" max="7"></label>
      <label>真实网关并发上限<input name="serial_concurrency_limit" type="number" min="1" max="7"></label>
      <label>单次采集时长（分钟）<input name="dwell_minutes" type="number" min="1" max="5"></label>
      <label>数据库保存间隔（秒）<input name="persist_interval_seconds" type="number" min="1" max="60"></label>
      <label>网页刷新次数/秒<input name="web_refresh_hz" type="number" min="1" max="10"></label>
      <p class="hint">切换网关模式会立即重新连接。使用真实网关前，请关闭厂商上位机，避免两个程序同时占用串口。</p>
      <p class="hint">真实 EW-DTU02 + 115200 RS485 默认最多同时连接 3 台；更多已登记设备将在采集轮换中逐台切换。除非已验证网关和 RS485 组合，请保留 3 台上限。</p>
      <button type="button" class="secondary" id="reconnectGatewayButton">按已保存设置重新连接网关</button>
      <div class="dialog-actions"><button type="button" data-close="settingsDialog" class="secondary">取消</button><button type="submi
